<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개역개정 성경 검색</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 30px;
            font-weight: 800;
        }

        .top-nav {
            display: grid;
            grid-template-columns: auto 1.4fr 0.9fr 0.9fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 24px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            background-color: #fff;
            color: var(--text-main);
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .nav-home {
            background-color: #0f172a;
        }

        .nav-home:hover {
            background-color: #1e293b;
        }

        #status {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            height: 20px;
        }

        .content-stage {
            position: relative;
            padding: 0 44px;
        }

        .chapter-toolbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .chapter-toolbar.active {
            display: flex;
        }

        .chapter-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
        }

        .copy-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .copy-controls label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
        }

        .copy-controls select {
            width: auto;
            min-width: 78px;
            padding: 8px 10px;
            font-size: 14px;
        }

        .copy-btn {
            padding: 10px 14px;
            white-space: nowrap;
        }

        .result-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-item {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .verse-ref {
            font-weight: 700;
            color: var(--primary-color);
            margin-right: 8px;
            font-size: 0.95em;
        }

        .result-item.chapter-mode {
            display: grid;
            grid-template-columns: 48px 1fr;
            gap: 12px;
            align-items: start;
        }

        .verse-number {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.95em;
            text-align: right;
            user-select: none;
        }

        .verse-content {
            line-height: 1.6;
        }

        .highlight {
            background-color: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .chapter-nav-btn {
            position: absolute;
            top: 56px;
            bottom: 0;
            width: 40px;
            border: none;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.10);
            color: rgba(15, 23, 42, 0.72);
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            z-index: 2;
        }

        .content-stage:hover .chapter-nav-btn,
        .chapter-nav-btn:focus-visible {
            opacity: 1;
        }

        .chapter-nav-btn:hover {
            background: rgba(59, 130, 246, 0.18);
        }

        .chapter-nav-btn:disabled {
            opacity: 0;
            cursor: default;
        }

        .chapter-nav-btn.left {
            left: 0;
        }

        .chapter-nav-btn.right {
            right: 0;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }

            .top-nav,
            .search-box,
            .chapter-toolbar {
                grid-template-columns: 1fr;
                display: grid;
            }

            .copy-controls {
                justify-content: stretch;
            }

            .copy-controls label,
            .copy-controls select,
            .copy-btn {
                width: 100%;
            }

            .result-item.chapter-mode {
                grid-template-columns: 38px 1fr;
                gap: 10px;
            }

            .chapter-nav-btn {
                top: auto;
                bottom: 16px;
                width: 44px;
                height: 44px;
                border-radius: 999px;
                opacity: 1;
            }

            .chapter-nav-btn.left {
                left: 8px;
            }

            .chapter-nav-btn.right {
                right: 8px;
            }

            .content-stage {
                padding: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>개역개정 성경 검색</h1>

        <div class="top-nav">
            <button id="homeBtn" class="nav-home" onclick="goHome()">홈</button>
            <select id="bookSelect" aria-label="성경 책 선택"></select>
            <select id="chapterSelect" aria-label="장 선택"></select>
            <select id="verseSelect" aria-label="절 선택"></select>
            <button id="browseBtn" onclick="browseBible()">이동</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="예: 창 1장, 요 3:16, 태초에"
                onkeydown="if(event.key === 'Enter') searchBible()">
            <button id="searchBtn" onclick="searchBible()">검색</button>
        </div>

        <div class="content-stage">
            <div id="status">데이터 준비중...</div>
            <div id="chapterToolbar" class="chapter-toolbar">
                <div id="chapterTitle" class="chapter-title"></div>
                <div class="copy-controls">
                    <label for="copyStartVerse">시작절
                        <select id="copyStartVerse" aria-label="복사 시작 절"></select>
                    </label>
                    <label for="copyEndVerse">끝절
                        <select id="copyEndVerse" aria-label="복사 끝 절"></select>
                    </label>
                    <button id="copyChapterBtn" class="copy-btn" onclick="copySelectedRange()">선택 본문 복사</button>
                </div>
            </div>
            <button id="prevChapterBtn" class="chapter-nav-btn left" onclick="navigateAdjacentChapter(-1)"
                aria-label="이전 장으로 이동">‹</button>
            <button id="nextChapterBtn" class="chapter-nav-btn right" onclick="navigateAdjacentChapter(1)"
                aria-label="다음 장으로 이동">›</button>
            <ul id="resultList" class="result-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>

</body>

</html>
